services:

  # =========================================================
  # MYSQL DATABASE
  # =========================================================

  mysql:
    image: mysql:8.4
    container_name: rms-mysql

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - rms-network

    restart: unless-stopped


  # =========================================================
  # SPRING BOOT BACKEND
  # =========================================================

  backend:
    build:
      context: ./backend/RmsBackend
      dockerfile: Dockerfile

    image: rms-backend
    container_name: rms-backend

    depends_on:
      - mysql

    ports:
      - "127.0.0.1:8080:8080"

    environment:

      # -----------------------------------------------------
      # DATABASE
      # -----------------------------------------------------

      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Kolkata

      SPRING_DATASOURCE_USERNAME: ${MYSQL_USERNAME}

      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}


      # -----------------------------------------------------
      # JWT
      # -----------------------------------------------------

      JWT_SECRET: ${JWT_SECRET}

      JWT_EXPIRATION: ${JWT_EXPIRATION}


      # -----------------------------------------------------
      # ADMIN USER
      # -----------------------------------------------------

      ADMIN_FULL_NAME: ${ADMIN_FULL_NAME}

      ADMIN_MOBILE_NO: ${ADMIN_MOBILE_NO}

      ADMIN_EMAIL: ${ADMIN_EMAIL}

      ADMIN_PASSWORD: ${ADMIN_PASSWORD}


      # -----------------------------------------------------
      # GROQ AI
      # -----------------------------------------------------

      GROQ_API_TOKEN: ${GROQ_API_TOKEN}


      # -----------------------------------------------------
      # AWS S3
      # -----------------------------------------------------

      AWS_S3_ACCESS_KEY_ID: ${AWS_S3_ACCESS_KEY_ID}

      AWS_S3_SECRET_ACCESS_KEY: ${AWS_S3_SECRET_ACCESS_KEY}

      AWS_S3_REGION: ${AWS_S3_REGION}

      AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME}

    networks:
      - rms-network

    restart: unless-stopped


  # =========================================================
  # PYTHON BILL MICROSERVICE
  # =========================================================

  bill-service:
    build:
      context: ./bill-service
      dockerfile: Dockerfile

    image: rms-bill-service
    container_name: rms-bill-service

    depends_on:
      - mysql

    env_file:
      - ./bill-service/.env

    environment:

      # -----------------------------------------------------
      # DATABASE
      # -----------------------------------------------------

      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USERNAME: ${MYSQL_USERNAME}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}


      # -----------------------------------------------------
      # CORS
      # -----------------------------------------------------

      BILL_SERVICE_ALLOWED_ORIGINS: https://hotelix.online,https://www.hotelix.online

    ports:
      - "127.0.0.1:8000:8000"

    networks:
      - rms-network

    restart: unless-stopped


  # =========================================================
  # REACT FRONTEND
  # =========================================================

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    image: rms-frontend
    container_name: rms-frontend

    depends_on:
      - backend
      - bill-service

    ports:
      - "127.0.0.1:8081:80"

    networks:
      - rms-network

    restart: unless-stopped


# =========================================================
# VOLUMES
# =========================================================

volumes:
  mysql_data:


# =========================================================
# NETWORK
# =========================================================

networks:
  rms-network:
    driver: bridge